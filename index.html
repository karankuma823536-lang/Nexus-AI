<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #4a90e2; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 80%; line-height: 1.4; }
        .user-message { background-color: #4a90e2; color: white; align-self: flex-end; }
        .ai-message { background-color: #e2e8f0; color: #333; align-self: flex-start; }
        #input-container { display: flex; padding: 10px; background: white; border-top: 1px solid #ccc; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 16px; }
        #send-btn { background-color: #4a90e2; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <header>Nexus AI</header>
    <div id="chat-container">
        <div class="message ai-message">नमस्ते! मैं Nexus AI हूँ। आज मैं आपकी क्या मदद कर सकता हूँ?</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="यहाँ अपना संदेश लिखें...">
        <button id="send-btn" onclick="sendMessage()">भेजें</button>
    </div>
    <script>
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (text === "") return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatContainer.appendChild(userDiv);
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                aiDiv.textContent = "बढ़िया सवाल है! मैं Nexus AI आपकी सेवा के लिए हमेशा तैयार हूँ।";
                chatContainer.appendChild(aiDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
