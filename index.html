<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus-AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #4a90e2; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 80%; line-height: 1.4; word-break: break-word; }
        .user-message { background-color: #4a90e2; color: white; align-self: flex-end; }
        .ai-message { background-color: #e2e8f0; color: #333; align-self: flex-start; }
        #input-container { display: flex; padding: 10px; background: white; border-top: 1px solid #ccc; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 16px; }
        #send-btn { background-color: #4a90e2; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #send-btn:hover { background-color: #357abd; }
    </style>
</head>
<body>
    <header>Nexus-AI</header>
    <div id="chat-container">
        <div class="message ai-message">नमस्ते! मैं Nexus-AI हूँ। आप मुझसे हिंदी या अंग्रेजी में कुछ भी पूछ सकते हैं!</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="यहाँ अपना संदेश लिखें...">
        <button id="send-btn" onclick="sendMessage()">भेजें</button>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6Lhbpun90uaGs1ZVjr_nhRd9p2nD6yKBY6bDMI_ma_I5Q";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (text === "") return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatContainer.appendChild(userDiv);
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.textContent = "सोच रहा हूँ...";
            chatContainer.appendChild(aiDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiDiv.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    aiDiv.textContent = "एरर: " + data.error.message;
                } else {
                    aiDiv.textContent = "क्षमा करें, AI से सही जवाब नहीं मिल पाया।";
                }
            } catch (error) {
                aiDiv.textContent = "क्षमा करें, कुछ तकनीकी दिक्कत आ रही है।";
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
